<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skippity Web Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel CDN (JSX 변환용) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // --- 게임 상수 ---
        const GRID_SIZE = 10;
        const COLORS = [
            { id: 'red', bg: 'bg-red-500', shadow: 'shadow-red-900', border: 'border-red-600', text: 'text-red-500', name: '레드' },
            { id: 'blue', bg: 'bg-blue-500', shadow: 'shadow-blue-900', border: 'border-blue-600', text: 'text-blue-500', name: '블루' },
            { id: 'green', bg: 'bg-green-500', shadow: 'shadow-green-900', border: 'border-green-600', text: 'text-green-500', name: '그린' },
            { id: 'yellow', bg: 'bg-yellow-400', shadow: 'shadow-yellow-600', border: 'border-yellow-500', text: 'text-yellow-600', name: '옐로우' },
            { id: 'orange', bg: 'bg-orange-500', shadow: 'shadow-orange-900', border: 'border-orange-600', text: 'text-orange-500', name: '오렌지' }
        ];

        // --- Lucide 아이콘 컴포넌트 (수정됨: toSvg 에러 방지) ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    // lucide.createIcons를 사용하여 DOM에 직접 주입하는 방식이 가장 안정적입니다.
                    window.lucide.createIcons({
                        attrs: {
                            class: className,
                            'stroke-width': 2,
                            width: size,
                            height: size
                        },
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name, size, className]);

            return <i data-lucide={name.toLowerCase().replace(/([a-z0-9])([A-Z])/g, '$1-$2')} ref={iconRef} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i>;
        };

        function App() {
            const [board, setBoard] = useState([]);
            const [scores, setScores] = useState({ red: 0, blue: 0, green: 0, yellow: 0, orange: 0 });
            const [selectedCell, setSelectedCell] = useState(null);
            const [possibleMoves, setPossibleMoves] = useState([]);
            const [gameState, setGameState] = useState('start');
            const [message, setMessage] = useState('가운데 4칸을 제외하고 채워진 보드에서 시작하세요!');

            const initGame = () => {
                const newBoard = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
                const centerCells = [[4, 4], [4, 5], [5, 4], [5, 5]];

                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (!centerCells.some(([cr, cc]) => cr === r && cc === c)) {
                            const colorObj = COLORS[Math.floor(Math.random() * COLORS.length)];
                            newBoard[r][c] = { ...colorObj };
                        }
                    }
                }

                setBoard(newBoard);
                setScores({ red: 0, blue: 0, green: 0, yellow: 0, orange: 0 });
                setSelectedCell(null);
                setPossibleMoves([]);
                setGameState('playing');
                setMessage('말을 선택한 후 점프할 빈 칸을 클릭하세요.');
            };

            const getPossibleMoves = (r, c, currentBoard) => {
                if (!currentBoard[r][c]) return [];
                const moves = [];
                const directions = [[0, 1], [0, -1], [1, 0], [-1, 0]];

                directions.forEach(([dr, dc]) => {
                    const midR = r + dr, midC = c + dc;
                    const endR = r + dr * 2, endC = c + dc * 2;
                    if (
                        endR >= 0 && endR < GRID_SIZE && endC >= 0 && endC < GRID_SIZE &&
                        currentBoard[midR][midC] !== null && currentBoard[endR][endC] === null
                    ) {
                        moves.push({ toR: endR, toC: endC, capR: midR, capC: midC });
                    }
                });
                return moves;
            };

            const handleCellClick = (r, c) => {
                if (gameState !== 'playing') return;

                if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                    setSelectedCell(null);
                    setPossibleMoves([]);
                    return;
                }

                const move = possibleMoves.find(m => m.toR === r && m.toC === c);
                if (selectedCell && move) {
                    const newBoard = [...board.map(row => [...row])];
                    const capturedColor = newBoard[move.capR][move.capC].id;
                    const movingPiece = newBoard[selectedCell.r][selectedCell.c];

                    newBoard[move.toR][move.toC] = movingPiece;
                    newBoard[selectedCell.r][selectedCell.c] = null;
                    newBoard[move.capR][move.capC] = null;

                    const newScores = { ...scores, [capturedColor]: scores[capturedColor] + 1 };
                    setBoard(newBoard);
                    setScores(newScores);
                    
                    const nextMoves = getPossibleMoves(move.toR, move.toC, newBoard);
                    if (nextMoves.length > 0) {
                        setSelectedCell({ r: move.toR, c: move.toC });
                        setPossibleMoves(nextMoves);
                        setMessage('대단해요! 연속 점프가 가능합니다.');
                    } else {
                        setSelectedCell(null);
                        setPossibleMoves([]);
                        checkGameOver(newBoard);
                    }
                    return;
                }

                if (board[r][c]) {
                    const moves = getPossibleMoves(r, c, board);
                    if (moves.length > 0) {
                        setSelectedCell({ r, c });
                        setPossibleMoves(moves);
                        setMessage('반짝이는 빈 칸으로 점프하세요!');
                    } else {
                        setMessage('점프할 수 없는 말입니다.');
                    }
                }
            };

            const checkGameOver = (currentBoard) => {
                let anyMoves = false;
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (currentBoard[r][c] && getPossibleMoves(r, c, currentBoard).length > 0) {
                            anyMoves = true; break;
                        }
                    }
                    if (anyMoves) break;
                }
                if (!anyMoves) {
                    setGameState('ended');
                    setMessage('게임 종료! 수집된 말의 세트를 확인하세요.');
                }
            };

            const setsCount = Math.min(...Object.values(scores));
            const totalPoints = (setsCount * 10) + (Object.values(scores).reduce((a, b) => a + b, 0) - setsCount * 5);

            const CollectionBar = ({ color, count, vertical = false }) => (
                <div className={`flex ${vertical ? 'flex-col-reverse h-full w-12' : 'flex-row w-full h-12'} items-center gap-2 bg-slate-800/50 p-2 rounded-xl border border-slate-700/50`}>
                    <div className={`w-6 h-6 rounded-full ${color.bg} shadow-lg shrink-0`} title={color.name} />
                    <div className={`flex ${vertical ? 'flex-col-reverse h-full' : 'flex-row w-full'} gap-1 overflow-hidden`}>
                        {[...Array(Math.max(count, 0))].map((_, i) => (
                            <div key={i} className={`${vertical ? 'w-8 h-2' : 'w-2 h-8'} ${color.bg} rounded-sm opacity-80 animate-in`} />
                        ))}
                    </div>
                    <span className="text-xs font-black text-white ml-auto">{count}</span>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 p-4 font-sans select-none flex flex-col items-center">
                    <header className="w-full max-w-5xl flex justify-between items-center mb-4">
                        <h1 className="text-2xl font-black italic flex items-center gap-2 tracking-tighter">
                            <Icon name="layout-grid" className="text-indigo-500" /> SKIPPITY <span className="text-xs font-normal text-slate-500 not-italic ml-2">Web Edition</span>
                        </h1>
                        <div className="flex items-center gap-4">
                            <div className="bg-slate-800 px-4 py-1 rounded-full border border-slate-700 flex items-center gap-2">
                                <Icon name="star" size={14} className="text-yellow-400 fill-yellow-400" />
                                <span className="text-sm font-bold">세트: {setsCount}</span>
                                <span className="text-indigo-400 font-black ml-2">Score: {totalPoints}</span>
                            </div>
                            <button onClick={initGame} className="p-2 bg-indigo-600 hover:bg-indigo-500 rounded-full transition-all shadow-lg flex items-center justify-center">
                                <Icon name="refresh-cw" size={20} />
                            </button>
                        </div>
                    </header>

                    <div className="relative flex flex-col items-center gap-4 w-full max-w-4xl mt-4">
                        <div className="w-full grid grid-cols-2 gap-4 px-12">
                           <CollectionBar color={COLORS[4]} count={scores.orange} />
                           <CollectionBar color={COLORS[3]} count={scores.yellow} />
                        </div>

                        <div className="flex items-center justify-center gap-4 w-full">
                            <div className="h-[400px] md:h-[500px]">
                                <CollectionBar color={COLORS[0]} count={scores.red} vertical />
                            </div>

                            <div className="bg-slate-800 p-2 rounded-2xl shadow-2xl border-4 border-slate-700 relative overflow-hidden group">
                                <div className="grid grid-cols-10 gap-1 bg-slate-900/50 p-1 rounded-lg">
                                    {board.map((row, r) => (
                                        row.map((cell, c) => {
                                            const isSelected = selectedCell?.r === r && selectedCell?.c === c;
                                            const isPossibleMove = possibleMoves.some(m => m.toR === r && m.toC === c);
                                            return (
                                                <div 
                                                    key={`${r}-${c}`}
                                                    onClick={() => handleCellClick(r, c)}
                                                    className={`
                                                        w-6 h-6 sm:w-8 sm:h-8 md:w-11 md:h-11 rounded-sm flex items-center justify-center cursor-pointer transition-all relative
                                                        ${(r + c) % 2 === 0 ? 'bg-slate-700' : 'bg-slate-800'}
                                                        ${isPossibleMove ? 'ring-2 ring-indigo-400 bg-indigo-500/20 z-10 animate-pulse' : 'hover:bg-slate-600'}
                                                    `}
                                                >
                                                    {cell && (
                                                        <div className={`
                                                            w-5 h-5 sm:w-7 sm:h-7 md:w-9 md:h-9 rounded-full shadow-lg transform transition-all
                                                            ${cell.bg} ${cell.shadow} border-b-4 border-black/20
                                                            ${isSelected ? 'scale-110 -translate-y-1 ring-4 ring-white z-20' : ''}
                                                        `} />
                                                    )}
                                                    {isPossibleMove && <div className="absolute w-2 h-2 bg-indigo-400 rounded-full animate-ping" />}
                                                </div>
                                            );
                                        })
                                    ))}
                                </div>
                                {gameState === 'start' && (
                                    <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 rounded-xl">
                                        <button onClick={initGame} className="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-black text-xl shadow-2xl transform transition hover:scale-110">GAME START</button>
                                    </div>
                                )}
                                {gameState === 'ended' && (
                                    <div className="absolute inset-0 bg-indigo-900/90 backdrop-blur-md flex flex-col items-center justify-center z-50 rounded-xl text-center p-6">
                                        <Icon name="trophy" size={60} className="text-yellow-400 mb-4 animate-bounce" />
                                        <h2 className="text-3xl font-black mb-2 uppercase">Finish!</h2>
                                        <div className="text-4xl font-black mb-6">{totalPoints} Points</div>
                                        <button onClick={initGame} className="px-6 py-2 bg-white text-indigo-900 rounded-full font-bold">REPLAY</button>
                                    </div>
                                )}
                            </div>

                            <div className="h-[400px] md:h-[500px]">
                                <CollectionBar color={COLORS[1]} count={scores.blue} vertical />
                            </div>
                        </div>

                        <div className="w-full px-12">
                            <CollectionBar color={COLORS[2]} count={scores.green} />
                        </div>
                    </div>

                    <div className="mt-8 bg-indigo-500/10 border border-indigo-500/20 px-6 py-2 rounded-full text-indigo-300 text-sm font-bold animate-pulse">
                        {message}
                    </div>

                    <footer className="mt-auto py-6 text-slate-600 text-[10px] tracking-widest uppercase">
                        Skippity Strategic Board Game Layout v2.1
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
